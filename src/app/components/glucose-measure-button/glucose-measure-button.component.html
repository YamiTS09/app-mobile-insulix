<section
  class="measurement-action"
  [class.waiting]="isWaiting"
  [class.reading]="isReading"
  [class.success]="isSuccess"
  [class.unavailable]="disabled && !isBusy"
>
  <div class="button-stage">
    @if (isWaiting) {
      <span class="sensor-wave wave-one" aria-hidden="true"></span>
      <span class="sensor-wave wave-two" aria-hidden="true"></span>
      <span class="sensor-wave wave-three" aria-hidden="true"></span>
    }

    @if (isReading) {
      <span class="reading-ring" aria-hidden="true"></span>
    }

    <button
      type="button"
      class="measure-button"
      [disabled]="isBusy || disabled"
      [attr.aria-label]="ariaLabel"
      [attr.aria-busy]="isWaiting || isReading"
      (click)="startMeasurement()"
    >
      @switch (state) {
        @case ('waitingSensor') {
          <span class="phone-sensor-icon" aria-hidden="true">
            <ion-icon name="phone-portrait-outline"></ion-icon>
            <i class="signal signal-one"></i>
            <i class="signal signal-two"></i>
          </span>
          <span class="button-copy waiting-copy">Preparando<br>prueba</span>
        }
        @case ('reading') {
          <ion-icon class="reading-icon" name="pulse-outline" aria-hidden="true"></ion-icon>
          <span class="button-copy reading-copy">Simulando<br>lectura</span>
        }
        @case ('success') {
          <ion-icon class="success-icon" name="checkmark-circle-outline" aria-hidden="true"></ion-icon>
          <span class="button-copy success-copy">Prueba<br>guardada</span>
        }
        @default {
          <ion-icon class="drop-icon" name="water" aria-hidden="true"></ion-icon>
          <span class="button-copy">Simular<br>lectura</span>
        }
      }
    </button>
  </div>

  <p class="action-help" role="status" aria-live="polite">
    {{ helpText }}
  </p>
</section>
